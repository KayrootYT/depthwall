
name: Build Depth Wallpaper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DepthWallpaper-Pro-Free-v4.1-repaired.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          ls -lah
          test -f "DepthWallpaper-Pro-Free-v4.1-repaired.zip"

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q "DepthWallpaper-Pro-Free-v4.1-repaired.zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100
          test -f extracted/DepthWallpaper/settings.gradle.kts
          test -f extracted/DepthWallpaper/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: extracted/DepthWallpaper
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        if: success()
        working-directory: extracted/DepthWallpaper
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DepthWallpaper-APK
          path: extracted/DepthWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
