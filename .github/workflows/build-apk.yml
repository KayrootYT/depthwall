name: Build Depth Wallpaper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DepthWallpaper-Pro-Free-v4.1-fixed.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          ls -lah
          test -f "DepthWallpaper-Pro-Free-v4.1-fixed.zip"

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q "DepthWallpaper-Pro-Free-v4.1-fixed.zip" -d extracted
          test -f extracted/DepthWallpaper/settings.gradle.kts
          test -f extracted/DepthWallpaper/app/build.gradle.kts
          echo "Project extracted successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: extracted/DepthWallpaper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace
          else
            echo "Gradle wrapper missing; using Gradle 8.9"
            gradle assembleDebug testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DepthWallpaper-APK
          path: extracted/DepthWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
